<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>My Fitness — Sin conexión</title>
    <!-- Todo en línea a propósito: esta página tiene que abrirse SIN internet
         y respetar el modo oscuro del móvil o el elegido en la app. -->
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f4f7f5;
        --border: #e1e6e3;
        --ink: #101614;
        --muted: #58635e;
        --accent: #1c7a58;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-tema="claro"]) {
          color-scheme: dark;
          --bg: #0f1512;
          --surface: #182019;
          --border: #2b3630;
          --ink: #e9f0ec;
          --muted: #a6b5ad;
          --accent: #5fd3a6;
          --on-accent: #0a1a13;
        }
      }
      :root[data-tema="oscuro"] {
        color-scheme: dark;
        --bg: #0f1512;
        --surface: #182019;
        --border: #2b3630;
        --ink: #e9f0ec;
        --muted: #a6b5ad;
        --accent: #5fd3a6;
        --on-accent: #0a1a13;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
      }
      main {
        padding: 28px 24px;
        max-width: 22rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--muted);
        margin: 0 0 24px;
      }
      button {
        background: var(--accent);
        color: var(--on-accent);
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mi-peso:tema");
          if (t === "oscuro" || t === "claro") {
            document.documentElement.setAttribute("data-tema", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>My Fitness</h1>
      <p>
        No hay conexión ahora mismo. Cuando vuelva la red, puedes entrar
        normalmente.
      </p>
      <button onclick="reintentar()">Reintentar</button>
    </main>
    <script>
      function reintentar() {
        window.location.reload();
      }
    </script>
  </body>
</html>
